name: pictools
description: "图片对比工具桌面应用"
publish_to: 'none'
version: 1.0.2+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0+1
  desktop_drop: ^0.5.0
  provider: ^6.1.2
  image: ^4.7.2
  rust_lib_pictools:
    path: rust_builder
  flutter_rust_bridge: 2.11.1
  freezed_annotation: ^2.4.1
  googleai_dart: ^3.0.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  build_runner: ^2.4.8
  freezed: ^2.4.6

flutter:
  uses-material-design: true
