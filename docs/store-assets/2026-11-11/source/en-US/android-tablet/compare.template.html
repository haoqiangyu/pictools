<!doctype html>
<html lang="en-US"><head><meta charset="utf-8"><title>{{title}}</title>
<style>
* {box-sizing:border-box} html,body {margin:0;width:1920px;height:1080px;overflow:hidden}
body {background:#F2EFE6;color:#202522;font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;-webkit-font-smoothing:antialiased}
.canvas {position:relative;width:100%;height:100%;overflow:hidden}
.brand {position:absolute;left:150px;top:83px;display:flex;align-items:center;gap:14px;font-family:"Helvetica Neue",sans-serif;font-size:48px;font-weight:500;line-height:1.2}
.brand svg {width:66px;height:66px;margin-left:-11px}
.copy {position:absolute;left:150px;top:171px;right:150px}
h1 {font-size:116px;font-weight:600;line-height:1.16;letter-spacing:-1px;white-space:pre-line;margin:0}
.note {position:absolute;left:150px;top:332px;right:150px;margin:0;color:#626B65;font-size:36px;font-weight:400;line-height:1.4}
.shot {position:absolute;margin:0;left:488.89px;top:460px;width:942.22px;height:530.0px;border-radius:26px;overflow:hidden;box-shadow:0 16px 36px rgba(32,37,34,.13);background:#F7F6F2;outline:2px solid rgba(32,37,34,.07)}
.shot img {width:100%;height:100%;display:block;object-fit:contain}
.corner {position:absolute;width:80px;height:80px;border-color:#202522;opacity:.18;border-style:solid;border-width:0}
.one {left:444.89px;top:415px;border-top-width:3px;border-left-width:3px}
.two {right:444.89px;bottom:48.0px;border-right-width:3px;border-bottom-width:3px}
</style></head><body><main class="canvas" role="img" aria-label="{{aria_label}}">
<div class="brand"><svg viewBox="0 0 128 128" aria-hidden="true"><path d="M31 57V36a5 5 0 0 1 5-5h21M71 97h21a5 5 0 0 0 5-5V71" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/><path d="M38 87V73l16-16 18 18 15-15v27H38Z" fill="currentColor"/><circle cx="84" cy="44" r="8" fill="currentColor"/></svg><span>Pictools</span></div>
<header class="copy"><h1>Spot the difference.</h1></header>
<p class="note">Slider · Side by side · Overlay</p><i class="corner one"></i><i class="corner two"></i>
<figure class="shot"><img src="{{image_uri}}" alt="{{image_alt}}"></figure>
</main></body></html>
